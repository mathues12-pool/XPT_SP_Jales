<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XPT_SP_Jales — Operação 3D</title>
<style>
:root{--bg:#e6eefa;--ink:#14233f;--mut:#6b7a95;--line:#e3eaf6;--pri:#2f6bff;--pri2:#e8f0ff;--glass:rgba(255,255,255,.86)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);font-size:13px}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas#c.drag{cursor:grabbing}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 34px rgba(50,80,150,.15);border-radius:16px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
b{font-weight:650}
.top{position:fixed;left:18px;right:18px;top:14px;height:58px;display:flex;align-items:center;gap:16px;padding:0 14px 0 16px;z-index:5}
.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;white-space:nowrap}
.logo{width:32px;height:32px;object-fit:contain;display:inline-block}
.center{margin:0 auto;display:flex;align-items:center;gap:10px}
.roofBtn{border:0;background:#eef2fa;border-radius:12px;padding:13px 16px;font:inherit;font-size:13.5px;color:var(--mut);cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.roofBtn.on{background:#ee4d2d;color:#fff;font-weight:650}
.modes{display:flex;gap:4px;background:#eef2fa;border-radius:12px;padding:4px}
.modes button{border:0;background:none;border-radius:9px;padding:9px 20px;font:inherit;font-size:13.5px;color:var(--mut);cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.modes button.on{background:#fff;color:#ee4d2d;font-weight:650;box-shadow:0 2px 8px rgba(50,80,150,.15)}
.ctrl{position:fixed;right:18px;top:96px;display:flex;flex-direction:column;gap:2px;padding:5px;z-index:4}
.ctrl button{width:34px;height:34px;border:0;background:none;border-radius:10px;color:#44546f;cursor:pointer;font:600 15px inherit;display:grid;place-items:center}
.ctrl button:hover{background:var(--pri2);color:var(--pri)}
.ctrl button.on{background:var(--pri);color:#fff}
.ctrl button svg{width:18px;height:18px}
.ctrl hr{border:0;border-top:1px solid var(--line);margin:3px 6px}
.sel{position:fixed;left:50%;top:84px;transform:translateX(-50%);padding:9px 12px 9px 14px;display:none;align-items:center;gap:12px;z-index:6}
.sel.on{display:flex}
.sel b{display:block}.sel small{color:var(--mut)}
.sel button{border:0;background:#eef2fa;border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:12px;color:#44546f}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;font-size:11px;color:#7f8fa9;z-index:3;pointer-events:none;white-space:nowrap}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;z-index:20;background:var(--bg)}
@media (max-width:1000px){.hint{display:none}}
@media (max-width:760px){.spacer{display:none}.top{gap:8px;padding:0 10px}.center{margin:0 0 0 auto;gap:6px}.roofBtn{padding:11px 10px}.roofBtn span{display:none}.modes button{padding:8px 10px;font-size:12.5px}.modes button svg{display:none}.brand{font-size:14px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"><div><h2>Não foi possível carregar o Three.js</h2><p style="margin-top:8px;color:var(--mut)">Esta página precisa de internet para baixar a biblioteca 3D (cdnjs.cloudflare.com).</p></div></div>

<div class="top glass">
  <div class="brand"><img class="logo" id="logoImg" alt="">XPT_SP_Jales</div>
  <div class="center">
  <div class="modes" id="modes">
    <button data-m="proc" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.3 7.5L12 12.5l8.7-5M12 22V12.5"/></svg>Processamento</button>
    <button data-m="exp"><svg class="i" viewBox="0 0 24 24"><path d="M3 13l2-5h11l3 5v4H3z"/><circle cx="7" cy="17" r="2"/><circle cx="16" cy="17" r="2"/></svg>Expedição</button>
  </div>
  <button id="bRoof" class="roofBtn" title="Mostrar / ocultar o teto do galpão (tecla T)"><svg class="i" viewBox="0 0 24 24"><path d="M2 10l10-6 10 6"/><path d="M4 10v10h16V10"/><path d="M2 10h20"/></svg><span>Teto</span></button>
  </div>
  <div class="brand spacer" style="visibility:hidden" aria-hidden="true"><span class="logo"></span>XPT_SP_Jales</div>
</div>

<div class="ctrl glass">
  <button id="bIn" title="Aproximar">+</button><button id="bOut" title="Afastar">−</button><hr>
  <button id="bRotL" title="Girar à esquerda">↺</button><button id="bRotR" title="Girar à direita">↻</button><button id="bHome" title="Resetar câmera">⌂</button><hr>
  <button id="bPlay" title="Pausar / continuar (espaço)">❚❚</button><button id="bSpeed" title="Velocidade da simulação">1×</button><button id="bTags" class="on" title="Mostrar etiquetas">Aa</button>
</div>

<div class="sel glass" id="sel"><div><b id="selN">—</b><small id="selS">—</small></div><button id="selX">Soltar câmera ✕</button></div>
<div class="hint">Arraste para girar · botão direito ou Shift para mover · scroll para zoom no ponto do mouse · clique em uma pessoa, carro ou carreta para seguir</div>

function box(w,h,d,c,x,y,z,parent,opt){
  const m=new T.Mesh(G(w,h,d),(c&&(c.isMaterial||Array.isArray(c)))?c:M(c));
  m.position.set(x||0,y||0,z||0);m.castShadow=!(opt&&opt.noCast);m.receiveShadow=!(opt&&opt.noRecv);
  (parent||scene).add(m);return m;
}
function cyl(rt,rb,h,c,seg,x,y,z,parent,rx,rz){

  m.position.set(x,y,z);if(rx)m.rotation.x=rx;if(rz)m.rotation.z=rz;m.castShadow=m.receiveShadow=true;(parent||scene).add(m);return m;
}

function textCanvas(text,o){
  const c=document.createElement('canvas'),x=c.getContext('2d');
  const fs=o.fs||44,font='700 '+fs+'px Inter,Segoe UI,Arial,sans-serif';x.font=font;
  c.width=Math.ceil(x.measureText(text).width)+(o.pad||0)*2;c.height=o.h||fs*1.5;
  x.font=font;x.textAlign='center';x.textBaseline='middle';
  if(o.bg){x.fillStyle=o.bg;const r=o.r!=null?o.r:c.height/2;x.beginPath();x.moveTo(r,0);x.arcTo(c.width,0,c.width,c.height,r);x.arcTo(c.width,c.height,0,c.height,r);x.arcTo(0,c.height,0,0,r);x.arcTo(0,0,c.width,0,r);x.fill();}
  x.fillStyle=o.fg||'#fff';x.fillText(text,c.width/2,c.height/2+2);
  const t=new T.CanvasTexture(c);t.anisotropy=8;return {tex:t,w:c.width,h:c.height};
}
function floorText(text,x,z,wid,color,rotZ,parent,y){
  const o=textCanvas(text,{fs:80,fg:color,pad:10});
  const m=new T.Mesh(new T.PlaneGeometry(wid,wid*o.h/o.w),new T.MeshBasicMaterial({map:o.tex,transparent:true,depthWrite:false}));
  m.rotation.x=-PI/2;m.rotation.z=rotZ||0;m.position.set(x,y||FLOOR+0.03,z);(parent||scene).add(m);return m;
}

const tasks=[];
function run(fn){return new Promise(res=>tasks.push({fn,res}));}
function stepTasks(dt){for(let i=tasks.length-1;i>=0;i--){const t=tasks[i];if(t.fn(dt)){tasks.splice(i,1);t.res();}}}
const wait=s=>{let t=0;return run(dt=>(t+=dt)>=s);};
function moveAlong(a,pts,speed,o){
  o=o||{};let i=0;
  return run(dt=>{
    if(i>=pts.length)return true;
    const p=a.g.position,dx=pts[i][0]-p.x,dz=pts[i][1]-p.z,dist=Math.hypot(dx,dz);let sp=speed;
    if(!o.back&&dist>0.02){const diff=angDiff(Math.atan2(dx,dz),a.g.rotation.y),mt=a.turn*dt;a.g.rotation.y+=clamp(diff,-mt,mt);if(Math.abs(diff)>0.6)sp*=a.type==='jack'?0.3:0.6;}
    const step=Math.min(dist,sp*dt);
    if(dist>1e-4){p.x+=dx/dist*step;p.z+=dz/dist*step;}
    a.moved+=step;
    if(dist-step<0.03){i++;if(i>=pts.length)return true;}
    return false;
  });
}
function turnTo(a,h){return run(dt=>{const d=angDiff(h,a.g.rotation.y),mt=a.turn*dt;if(Math.abs(d)<=mt){a.g.rotation.y=h;return true;}a.g.rotation.y+=Math.sign(d)*mt;return false;});}
function tween(dur,fn){let t=0;return run(dt=>{t+=dt;const k=Math.min(1,t/dur);fn(k);return k>=1;});}

const near=(w,x,z,r)=>Math.hypot(w.g.position.x-x,w.g.position.z-z)<(r||0.3);
function driveKeys(c,keys,speed,R){
  const pts=keys.map(k=>new T.Vector3(k[0],0,k[1]));
  const curve=new T.CatmullRomCurve3(pts,false,'centripetal'),len=curve.getLength();
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+pts[i].distanceTo(pts[i-1]));
  const tot=cum[cum.length-1],dur=len/speed*1.15;let t=0,prev=0;
  return run(dt=>{
    t+=dt;const k=Math.min(1,t/dur),e=smooth(k),p=curve.getPointAt(e);
    c.g.position.set(p.x,rampY(p.x),p.z);
    const f=e*tot;let i=0;while(i<cum.length-2&&f>cum[i+1])i++;
    const u=clamp((f-cum[i])/Math.max(1e-6,cum[i+1]-cum[i]),0,1);
    c.g.rotation.y=keys[i][2]+(keys[i+1][2]-keys[i][2])*u;

function copaPath(md,from){
  if(md==='proc'){
    const start=from[0]>6?[[7.6,from[1]],[7.6,5.15]]:[[-9.3,from[1]],[-9.3,5.15]];
    return start.concat([[-21,5.15],[-21,4.0],[-26.6,4.0],[-26.6,5.4],[-30.4,6.4],[-30.4,8.2]]);
  }
  return [[from[0],from[1]>0?0.6:-0.6],[1.5,0],[-1.2,1.0],[-26.8,1.0],[-26.8,5.4],[-26.8,8.2]];
}
async function takeBreak(w){
  w.breakReq=false;w.onBreak=true;
  const md=w.mode,orig=[w.g.position.x,w.g.position.z],path=copaPath(md,orig);
  w.status='Indo para a copa';w.pose='idle';
  await moveAlong(w,path,3.4);
  const seat=md==='proc'?{x:-29.55,z:8.2,h:PI/2}:{x:-27.25,z:8.2,h:-PI/2};
  w.g.position.set(seat.x,FLOOR+0.5-1.07,seat.z);w.g.rotation.y=seat.h;w.pose='sit';w.status='Intervalo na copa';

  const last=path[path.length-1];w.g.position.set(last[0],FLOOR,last[1]);w.pose='idle';w.status='Voltando da copa';
  await moveAlong(w,path.slice(0,-1).reverse().concat([orig]),3.4);
  w.onBreak=false;
}
function breakRotation(list,offset){
  (async()=>{let i=0;await wait(offset);while(true){const w=list[i++%list.length];if(!w.onBreak)w.breakReq=true;await wait(40);}})();
}

// ciclo da carreta
async function truckCycle(instant){
  while(true){
    if(!instant){await wait(rnd(6,12));while(DESC.filter(s=>s.g).length>7)await wait(1);await gateAcquire('proc',1);}
    const t=makeTruck();procTruck=t;
    if(instant){const l=TK.rev[TK.rev.length-1];t.g.position.set(l[0],FLOOR,l[1]);t.g.rotation.y=l[2];}
    else{await driveKeys(t,TK.in,7,0.46);await driveKeys(t,TK.rev,2.8,0.46);gateRelease('proc',1);}
    instant=false;ramp.visible=true;t.state='unloading';
    while(t.loads.length||t.edge||t.busy||PM2.inTruck)await wait(0.5);
    t.state='leaving';ramp.visible=false;await wait(1.5);
    await gateAcquire('proc',1);await driveKeys(t,TK.out,7,0.46);gateRelease('proc',1);
    P.remove(t.g);const i=tags.indexOf(t.tag);if(i>=0)tags.splice(i,1);procTruck=null;
  }
}

async function pm2Loop(){
  const w=PM2,X0=-11.9-1.15;   // centro da paleteira com a carga na borda
  while(true){
    const t=procTruck;
    if(!t||t.state!=='unloading'){w.status='Aguardando carreta';if(!near(w,w.home[0],w.home[1],0.6))await moveAlong(w,[w.home],1.8);await turnTo(w,-PI/2);await wait(0.6);continue;}
    w.status='Subindo na carreta';
    await moveAlong(w,[[-10.4,4.75],[-10.4,2.2]],1.8);await turnTo(w,-PI/2);
    await moveAlong(w,[[X0,2.2]],1.2);w.inTruck=true;
    while(t.loads.length){
      if(t.edge||TP1inTruck()){w.status='Aguardando a TP-01 retirar';await wait(0.3);continue;}
      t.loads.sort((a,b)=>a.d-b.d);const u=t.loads[0],lz=2.2+u.lat;
      w.status='Puxando carga até a borda';
      await moveAlong(w,[[X0,lz]],1.0,{back:true});
      await moveAlong(w,[[-11.9-u.d+1.15,lz]],1.6,{back:true});
      await liftTo(w,0);t.loads.shift();jackLoad(w,u.g);await wait(0.2);await liftTo(w,0.1);
      await moveAlong(w,[[X0,lz]],1.1,{back:true});

    await moveAlong(w,[[-10.4,4.75],w.home],1.8);

function alongBack(tr,cur,D){let d=D;for(let i=tr.length-1;i>=0;i--){const q=tr[i],L=Math.hypot(cur[0]-q[0],cur[1]-q[1]);if(L>=d&&L>0){const t=d/L;return [cur[0]+(q[0]-cur[0])*t,cur[1]+(q[1]-cur[1])*t];}d-=L;cur=q;}return tr[0];}
function alongFwd(cur,rest,D,full){
  let d=D,a=cur;for(const q of rest){const L=Math.hypot(q[0]-a[0],q[1]-a[1]);if(L>=d&&L>0){const t=d/L;return [a[0]+(q[0]-a[0])*t,a[1]+(q[1]-a[1])*t];}d-=L;a=q;}
  const n=full.length,p0=full[n-2],p1=full[n-1],L=Math.hypot(p1[0]-p0[0],p1[1]-p0[1])||1;return [a[0]+(p1[0]-p0[0])/L*d,a[1]+(p1[1]-p0[1])/L*d];
}
function cartTick(w){
  const c=w.cart;if(!c)return;const p=w.g.position,g=c.g;let pos;
  if(c.mode==='trail'){const tr=c.trail,l=tr[tr.length-1];if(Math.hypot(p.x-l[0],p.z-l[1])>0.04)tr.push([p.x,p.z]);pos=alongBack(tr,[p.x,p.z],c.D);}
  else{while(c.i<c.path.length&&Math.hypot(p.x-c.path[c.i][0],p.z-c.path[c.i][1])<0.08)c.i++;pos=alongFwd([p.x,p.z],c.path.slice(c.i),c.D,c.path);}
  g.cx=pos[0];g.cz=pos[1];g.cry=Math.atan2(p.x-pos[0],p.z-pos[1]);
  placeGai(GX,g,g.cx,g.cz,g.cry,true);
}

const cam=new T.OrthographicCamera(-1,1,1,-1,0.1,800);
const HOME={az:0.1,el:0.8,zoom:1.25,tx:-1,tz:-2.5};
const view={az:HOME.az,azT:HOME.az,el:HOME.el,zoom:HOME.zoom,zoomT:HOME.zoom,size:66,target:new T.Vector3(HOME.tx,0,HOME.tz),anchor:null};
let follow=null;
function updateCam(){
  const w=innerWidth,hh=innerHeight,a=w/hh,s=view.size/view.zoom;
  cam.left=-s*a/2;cam.right=s*a/2;cam.top=s/2;cam.bottom=-s/2;cam.updateProjectionMatrix();
  const d=300,ce=Math.cos(view.el);
  cam.position.set(view.target.x+Math.sin(view.az)*ce*d,view.target.y+Math.sin(view.el)*d,view.target.z+Math.cos(view.az)*ce*d);
  cam.lookAt(view.target);
}
function resize(){renderer.setSize(innerWidth,innerHeight,false);updateCam();}
addEventListener('resize',resize);
let drag=null;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,pan:e.button===2||e.shiftKey};canvas.classList.add('drag');});
canvas.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  if(drag.pan){

    const k=(view.size/view.zoom)/innerHeight,r=[Math.cos(view.az),-Math.sin(view.az)],f=[-Math.sin(view.az),-Math.cos(view.az)];
    view.target.x+=-r[0]*dx*k+f[0]*dy*k/Math.sin(view.el);view.target.z+=-r[1]*dx*k+f[1]*dy*k/Math.sin(view.el);
  }else{view.az-=dx*0.006;view.azT=view.az;view.el=clamp(view.el+dy*0.004,0.32,1.35);}

});

function selectAt(px,py){
  if(roofOn)return;
  ray.setFromCamera(new T.Vector2(px/innerWidth*2-1,-(py/innerHeight)*2+1),cam);
  const list=actors.filter(a=>a.mode==='all'||a.mode===mode).map(a=>a.g);
  if(mode==='exp')cars.forEach(c=>list.push(c.g));else if(procTruck)list.push(procTruck.g);
  const hits=ray.intersectObjects(list,true);
  for(const h of hits){let o=h.object;while(o&&!o.userData.actor)o=o.parent;if(o){follow=o.userData.actor;view.anchor=null;view.zoomT=Math.max(view.zoomT,2.4);$('#sel').classList.add('on');return;}}
}

$('#bIn').onclick=()=>{view.anchor=null;view.zoomT=clamp(view.zoomT*1.3,0.35,7);};
$('#bOut').onclick=()=>{view.anchor=null;view.zoomT=clamp(view.zoomT/1.3,0.35,7);};
$('#bRotL').onclick=()=>view.azT-=PI/4;
$('#bRotR').onclick=()=>view.azT+=PI/4;
$('#bHome').onclick=()=>{unfollow();view.anchor=null;view.azT=HOME.az;view.el=HOME.el;view.zoomT=HOME.zoom;view.target.set(HOME.tx,0,HOME.tz);};
const speeds=[1,2,4];let si=0;
$('#bSpeed').onclick=()=>{si=(si+1)%speeds.length;sim.speed=speeds[si];$('#bSpeed').textContent=sim.speed+'×';};
const togglePlay=()=>{sim.paused=!sim.paused;$('#bPlay').textContent=sim.paused?'▶':'❚❚';$('#bPlay').classList.toggle('on',sim.paused);};
$('#bPlay').onclick=togglePlay;
$('#bTags').onclick=()=>{tagsOn=!tagsOn;$('#bTags').classList.toggle('on',tagsOn);};
$('#bRoof').onclick=()=>{roofOn=!roofOn;roofGrp.visible=roofOn;$('#bRoof').classList.toggle('on',roofOn);if(roofOn)unfollow();};
function setMode(m){
  mode=m;grpProc.visible=m==='proc';grpExp.visible=m==='exp';
  [...$('#modes').children].forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  if(follow&&(follow.type==='car'||follow.type==='truck'||(follow.mode&&follow.mode!=='all'&&follow.mode!==m)))unfollow();
}
$('#modes').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m);});
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  if(e.key==='1')setMode('proc');if(e.key==='2')setMode('exp');
  if(e.key==='t'||e.key==='T')$('#bRoof').click();
  if(e.key==='Escape')$('#selX').click();});
function refreshUI(){
  if(follow){$('#selN').textContent=follow.name+' · '+follow.role;
    $('#selS').textContent=follow.type==='car'?({arriving:'Chegando',loading:'Carregando '+follow.loaded+(follow.target!=null?'/'+follow.target:''),ready:'Aguardando liberação',leaving:'Saindo para a rota'}[follow.state]||'')
      :follow.type==='truck'?({arriving:'Chegando',unloading:'Descarregando · '+follow.loads.length+' cargas restantes',leaving:'Saindo'}[follow.state]||''):follow.status;}
}

/* ============================== loop principal ============================== */
let last=performance.now(),uiT=0,clockT=0;
const JACKS=[PM2,TP1,PM1];
function simStep(dt){
  actors.forEach(a=>a.moved=0);
  stepTasks(dt);updateGates(dt);updateBelt(dt);
  cars.forEach(c=>{c.trunkK+=clamp(c.trunkT-c.trunkK,-dt*1.5,dt*1.5);c.trunk.rotation.x=smooth(c.trunkK)*1.25;});
  JACKS.forEach(j=>{j.g.position.y=jackY(j.g.position.x,j.g.position.z);j.wheels.forEach(w=>w.rotation.x+=j.moved/0.16);});
  LIB.forEach(cartTick);
}
function frameLoop(now){
  const rdt=Math.min(0.05,(now-last)/1000);last=now;clockT+=rdt;
  simStep(sim.paused?0:rdt*sim.speed);
  actors.forEach(a=>{if(a.mode!=='all'&&a.mode!==mode)return;if(a.type==='worker')animWorker(a,clockT);else if(a.type==='jack'){if(a.walker)a.driver.moved=a.moved;animWorker(a.driver,clockT);if(a.beacon)a.beacon.visible=a.status.indexOf('Aguard')<0&&Math.floor(clockT*3)%2===0;}});
  const tk=clamp(1.15/Math.pow(view.zoom,0.8),0.32,1.3);
  tags.forEach(t=>{t.visible=tagsOn&&!roofOn;t.scale.set(t.userData.bs.x*tk,t.userData.bs.y*tk,1);});
  const z0=view.zoom;view.zoom+=(view.zoomT-view.zoom)*Math.min(1,rdt*7);
  view.az+=(view.azT-view.az)*Math.min(1,rdt*7);
  if(view.anchor&&!follow&&Math.abs(view.zoom-z0)>1e-5){
    const nz=view.zoom;view.zoom=z0;updateCam();const p0=groundAt(view.anchor.x,view.anchor.y);
    view.zoom=nz;updateCam();const p1=groundAt(view.anchor.x,view.anchor.y);
    if(p0&&p1){view.target.x+=p0.x-p1.x;view.target.z+=p0.z-p1.z;}
  }else if(Math.abs(view.zoomT-view.zoom)<1e-4)view.anchor=null;
  if(follow&&follow.g.parent){const p=follow.g.getWorldPosition(new T.Vector3());view.target.x+=(p.x-view.target.x)*Math.min(1,rdt*4);view.target.z+=(p.z-view.target.z)*Math.min(1,rdt*4);}
  else if(follow)unfollow();
  updateCam();
  uiT+=rdt;if(uiT>0.5){uiT=0;refreshUI();}
  renderer.render(scene,cam);
  requestAnimationFrame(frameLoop);
}

/* ============================== início ============================== */
buildCity();
// estado inicial do processamento
DESC.filter(s=>s.kind==='gaylord').slice(0,5).forEach(s=>{s.g=makeGaylord(rint(14,18));P.add(s.g);s.g.position.set(s.x,FLOOR,s.z);});
DESC.filter(s=>s.kind==='sack').slice(0,1).forEach(s=>{s.g=makeSackPallet(rint(14,18));P.add(s.g);s.g.position.set(s.x,FLOOR,s.z);});
FEED[0].g=makeGaylord(rint(10,16));FEED[1].g=makeSackPallet(rint(10,16));
FEED.forEach(f=>{P.add(f.g);f.g.position.set(f.x,FLOOR,f.z);});
M1SLOTS.slice(0,4).forEach(s=>{s.p=makePkg(rint(0,5));P.add(s.p);s.p.position.set(s.x,slotY(s),s.z);});
M2SLOTS.filter(s=>s.l===0).slice(0,5).forEach((s,i)=>{s.p=makePkg(rint(0,5));P.add(s.p);s.p.position.set(s.x,slotY(s,0),s.z);s.p.rotation.y=rnd(-0.4,0.4);s.t=i;});
truckCycle(true);pm2Loop();tp1Loop();pm1Loop();IND.forEach(inductorLoop);feederLoop();SORT.forEach(sorterLoop);supPLoop();
breakRotation(SORT.concat(IND),15);
// estado inicial da expedição
routes.forEach((r,i)=>carCycle(r,i!==2&&i!==4));
LIB.forEach(libLoop);kaiqueLoop();supXLoop();
breakRotation(LIB,25);
setMode('proc');resize();refreshUI();
requestAnimationFrame(frameLoop);
// depuração: avança a simulação mesmo com a aba em segundo plano
window.__step=async function(sec){for(let t=0;t<sec;t+=0.05){simStep(0.05);for(let k=0;k<40;k++)await Promise.resolve();}actors.forEach(a=>{if(a.type==='worker')animWorker(a,1);else if(a.type==='jack')animWorker(a.driver,1);});refreshUI();updateCam();renderer.render(scene,cam);};
window.__sim={sim,actors,routes,GAI,view,DESC,FEED,M2SLOTS,cars,LIB,get truck(){return procTruck;},setMode};
})();
</script>
